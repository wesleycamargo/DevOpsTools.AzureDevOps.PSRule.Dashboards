name: PSRule Manual Assessment and Workbook Publishing
trigger: none
pr: none

parameters:
  - name: reportOnly
    displayName: Generate reports without Azure Monitor publishing
    type: boolean
    default: false

variables:
  PSRuleReportReady: 'false'

resources:
  repositories:
    - repository: rules
      type: github
      endpoint: github.com_wesleycamargo
      name: wesleycamargo/PSRule.Rules.AzureDevOps
      ref: refs/heads/main

pool:
  name: AI-Pool

steps:
  - checkout: self
    path: s/dashboards
  - checkout: rules
    path: s/rules
  - task: AzureCLI@2
    displayName: Assess organization and publish workbook results
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      azureSubscription: psrule-azure
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: $(Pipeline.Workspace)/s/dashboards/src/scripts/Invoke-PSRuleWorkbookAssessment.ps1
      arguments: >-
        -ReportOnly:$${{ parameters.reportOnly }}
        -ModuleManifestPath "$(Pipeline.Workspace)/s/rules/src/PSRule.Rules.AzureDevOps/PSRule.Rules.AzureDevOps.psd1"
      visibleAzLogin: false
      useGlobalConfig: false
  - task: PublishBuildArtifacts@1
    displayName: Publish PSRule reports
    condition: succeededOrFailed()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: psrule-results
      publishLocation: Container
  - task: PublishHtmlReport@1
    displayName: Publish DevOps Assessment Analytics tab
    condition: and(succeededOrFailed(), eq(variables['PSRuleReportReady'], 'true'))
    inputs:
      reportDir: $(Build.ArtifactStagingDirectory)/psrule-dashboard.html
      tabName: DevOps Assessment Analytics
      useFilenameTabs: false
